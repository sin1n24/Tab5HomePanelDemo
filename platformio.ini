; Tab5 おうちパネル デモ版（Wi-Fi・サーバー不要。架空のデータで操作を体験する）
; ESP32-P4 は pioarduino が必要。pioarduino 55 系は Python 3.10+ の PlatformIO で動かす（README 参照）
;
; env は Tab5 のチップのリビジョンで選ぶ。書き込み時の esptool の表示
;   "Chip is ESP32-P4 (revision v1.x)"  → tab5      （初期ロット。ES 品）
;   "Chip is ESP32-P4 (revision v3.x)"  → tab5_rev3
[platformio]
default_envs = tab5
; Windows の 260 文字制限対策。既定の %USERPROFILE%\.platformio だと
; framework の esp_matter ヘッダー展開でパスが長すぎて失敗する（LongPathsEnabled=0 の場合）
core_dir = C:/pio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = m5stack-tab5-p4
; 日本語フォント込みで約3.3MB。既定(1.3MB)のアプリ領域には入らないので16MB用を明示する
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.32
    https://github.com/m5stack/M5Unified.git#0.2.25

[env:tab5]

[env:tab5_rev3]
board_build.chip_variant = esp32p4
